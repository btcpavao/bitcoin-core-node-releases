name: Rebuild and compare Node
on:
  workflow_dispatch:
  push:
    paths:
      - 'rebuild/**'
      - '.github/workflows/node-rebuild.yml'
      - 'btcpavao-pgp.asc'
concurrency:
  group: node-rebuild-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 20
    env:
      DEBIAN_FRONTEND: noninteractive
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Install source check dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg git patch python3 python3-yaml python3-pyside6.qtwidgets python3-pyside6.qttest qt6-svg-plugins fonts-dejavu-core util-linux xvfb xauth x11-xserver-utils
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reconstruct and check the exact candidate source
        shell: bash
        run: |
          set -euo pipefail
          bash rebuild/node source "$RUNNER_TEMP/candidate-source"
          cd "$RUNNER_TEMP/candidate-source"
          python3 -m unittest discover -s tests -p 'test_shared_display*.py' -v
          for suite in test_display_snapshot_bridge test_device_profiles test_unified_settings test_footer_right_stack test_settings_cards_navigation test_status_centering test_install_plan test_installer_disks; do
            python3 -m unittest discover -s tests -p "$suite.py" -v
          done
          python3 tests/shared_display_x11_smoke.py \
            --module-dir "$PWD/runtime/usr/share/core-desktop" \
            --scale-helper "$PWD/runtime/usr/local/bin/core-display-scale" \
            --output "$RUNNER_TEMP/display-x11-evidence"
  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        builder: [one, two]
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Make room for the Debian filesystems on the disposable runner
        run: |
          if [ "$(df --output=avail -BG / | tail -1 | tr -dc 0-9)" -lt 45 ]; then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          fi
          df -h /
      - name: Record builder CPU
        run: LC_ALL=C lscpu | grep -E '^(Architecture|Vendor ID|Model name):'
      - run: bash rebuild/node build "$RUNNER_TEMP/result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: node-${{ matrix.builder }}
          path: ${{ runner.temp }}/result/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
  compare:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: node-*
          path: results
      - name: Compare both complete ISOs
        run: |
          bash rebuild/node compare results/node-one/bitcoin-core-node-candidate-amd64.iso results/node-two/bitcoin-core-node-candidate-amd64.iso
          cat results/node-one/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
