defaultGroups: [sudo, video, audio, netdev, bitcoin-rpc]
setRootPassword: false
doAutologin: false
allowWeakPasswords: false
passwordRequirements:
  minLength: 8
  maxLength: 128
user:
  shell: /bin/bash
  forbidden_names: [root, node-live, bitcoinnode]
  home_permissions: "o700"
hostname:
  location: EtcFile
  writeHostsFile: true
  template: bitcoin-core-node
allowActiveDirectory: false
