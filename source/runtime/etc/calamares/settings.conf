modules-search: [ local ]
branding: core-node
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
instances:
  - id: node-target
    module: shellprocess
    config: node-target.conf
sequence:
  - show:
      - keyboard
      - partition
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - keyboard
      - fstab
      - shellprocess@node-target
      - initramfscfg
      - initramfs
      - bootloader
      - umount
  - show:
      - finished
