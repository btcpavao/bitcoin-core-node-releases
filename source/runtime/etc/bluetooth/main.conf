# Support classic HID and Bluetooth LE mice and keyboards.
[General]
ControllerMode=dual
DiscoverableTimeout=180

[Policy]
AutoEnable=true
# HID and HID-over-GATT reconnection after a lost connection.
ReconnectUUIDs=00001124-0000-1000-8000-00805f9b34fb,00001812-0000-1000-8000-00805f9b34fb
ReconnectAttempts=7
ReconnectIntervals=1,2,4,8,16,32,64
